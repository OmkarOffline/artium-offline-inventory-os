<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Inventory OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<style>
  body{overflow:auto;}
  .login-shell{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 20% 20%, var(--accent-dim), transparent 45%),
               radial-gradient(circle at 85% 80%, var(--accent-dim), transparent 40%),
               var(--bg);
    padding:24px;
  }
  .login-card{
    width:380px;max-width:100%;background:var(--bg-elevated);border:1px solid var(--border-soft);
    border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:36px 32px 32px;
    display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;
  }
  .login-mark{
    width:52px;height:52px;border-radius:16px;background:linear-gradient(150deg,var(--accent-2),var(--accent));
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#fff;
    box-shadow:0 1px 0 rgba(255,255,255,.35) inset, 0 8px 20px rgba(91,98,234,.35);margin-bottom:6px;
  }
  .login-title{font-size:19px;font-weight:800;letter-spacing:-.01em;color:var(--text);}
  .login-org{font-size:12px;color:var(--text-faint);font-weight:600;margin-bottom:10px;}
  .login-desc{font-size:12.5px;color:var(--text-dim);line-height:1.6;margin:6px 0 22px;}
  .google-btn{
    width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 16px;
    border-radius:var(--radius-sm);border:1px solid var(--border);background:#fff;color:var(--text);
    font-size:13px;font-weight:700;box-shadow:var(--emboss);transition:all .13s ease;
  }
  .google-btn:hover{transform:translateY(-1px);box-shadow:var(--emboss-hover);border-color:#d3d7e3;}
  .google-btn:disabled{opacity:.55;cursor:default;transform:none;}
  .login-note{font-size:11px;color:var(--text-faint);margin-top:18px;}
  .login-message{
    width:100%;font-size:12px;font-weight:600;padding:10px 12px;border-radius:var(--radius-sm);
    margin-bottom:16px;display:none;text-align:left;
  }
  .login-message.show{display:block;}
  .login-message.error{background:var(--red-soft);color:var(--red);}
  .login-message.info{background:var(--blue-soft);color:var(--blue);}
</style>
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="login-mark">IOS</div>
      <div class="login-title">Inventory OS</div>
      <div class="login-org">Artium Academy — Offline Centres</div>

      <div id="loginMessage" class="login-message"></div>

      <div class="login-desc">
        Where "someone probably knows where that is" stops being an acceptable
        answer. Sign in with your Artium Google account to continue.
      </div>

      <button id="googleSignInBtn" class="google-btn">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.71v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.61z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.97L3.95 7.3C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
        <span id="googleSignInLabel">Sign in with Google</span>
      </button>

      <div class="login-note">Access is restricted to @artiumacademy.com accounts.</div>
    </div>
  </div>

  <script>
    // Plain (non-module) script so it still runs even when the module script
    // below is blocked by the browser (happens when opened as file://).
    if (window.location.protocol === "file:") {
      const msg = document.getElementById("loginMessage");
      msg.textContent = "This page needs to be served over HTTP for sign-in to work — run npx serve . or python3 -m http.server 8080 from the project folder, then open it via http://localhost:.../login.html.";
      msg.className = "login-message show error";
      document.getElementById("googleSignInBtn").disabled = true;
    }
  </script>
  <script type="module">
    import { signInWithGoogle, requireGuest } from "./js/auth.js";
    import { IS_FIREBASE_CONFIGURED } from "./js/firebase.js";

    const messageEl = document.getElementById("loginMessage");
    const btn = document.getElementById("googleSignInBtn");
    const label = document.getElementById("googleSignInLabel");

    function showMessage(text, kind = "error") {
      messageEl.textContent = text;
      messageEl.className = `login-message show ${kind}`;
    }

    const params = new URLSearchParams(window.location.search);
    if (params.get("pending")) {
      showMessage("Your account has been registered and is waiting for an Owner to approve it. You'll be able to sign in once that happens.", "info");
    } else if (params.get("disabled")) {
      showMessage("Your access has been disabled. Contact your Owner if you believe this is a mistake.");
    } else if (params.get("denied")) {
      showMessage("You do not have access to Inventory OS. Contact your Owner to be added.");
    } else if (params.get("error")) {
      showMessage("Something went wrong while signing you in. Please try again.");
    }

    if (!IS_FIREBASE_CONFIGURED) {
      showMessage("Firebase is not configured yet — sign-in is disabled until js/firebase.js has real project credentials.");
      btn.disabled = true;
    }

    btn.addEventListener("click", async () => {
      btn.disabled = true;
      label.textContent = "Signing in…";
      try {
        await signInWithGoogle();
        // requireGuest below will handle the redirect once the profile resolves.
      } catch (err) {
        console.error("[login] Sign-in failed:", err);
        showMessage("Sign-in was cancelled or failed. Please try again.");
        btn.disabled = false;
        label.textContent = "Sign in with Google";
      }
    });

    // If already authenticated (persistent session), skip straight to the app.
    requireGuest(() => {
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
